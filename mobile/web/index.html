  <style>
    @font-face {
      font-family: 'MaterialIcons';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('fonts/MaterialIcons-Regular.otf') format('opentype'),
           url('assets/fonts/MaterialIcons-Regular.otf') format('opentype');
    }

    :root {
      --st-app-height: 100dvh;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0D1B4B;
      -webkit-text-size-adjust: 100%;
    }

    html:not(.pwa-standalone) body {
      min-height: 100%;
      min-height: 100dvh;
    }

    /* PWA : pas de rubber-band, mais AUCUNE taille custom sur Flutter
       (sinon décalage Y des clics — boutons réagissent "au-dessus"). */
    html.pwa-standalone,
    html.pwa-standalone body {
      overflow: hidden;
      overscroll-behavior: none;
      width: 100%;
      height: 100%;
      position: fixed;
      inset: 0;
    }

    /*
      CRITIQUE hit-testing PWA iOS :
      Ne PAS forcer height/width/touch-action sur flutter-view.
      Si le CSS dit visualViewport.height et Flutter utilise innerHeight,
      les clics se décalent vers le HAUT du bouton (symptôme exact).
      Laisser le moteur Flutter dimensionner sa surface.
    */
    flutter-view,
    flt-glass-pane,
    flt-scene-host {
      position: absolute;
      inset: 0;
      -webkit-tap-highlight-color: transparent;
    }

    flt-semantics-host,
    flt-semantics-placeholder {
      pointer-events: none !important;
    }

    #st-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #0D1B4B;
      transition: opacity 280ms ease, visibility 280ms ease;
    }

    #st-splash.st-splash-hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none !important;
    }

    .st-splash-orb {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      animation: st-orb-float 8s ease-in-out infinite;
    }

    .st-splash-orb-a {
      width: 220px;
      height: 220px;
      top: -40px;
      right: -30px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.22) 0%, transparent 70%);
    }

    .st-splash-orb-b {
      width: 260px;
      height: 260px;
      bottom: 40px;
      left: -70px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.14) 0%, transparent 70%);
      animation-delay: -3s;
    }

    .st-splash-orb-c {
      width: 90px;
      height: 90px;
      top: 120px;
      left: 40px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.06) 0%, transparent 70%);
      animation-delay: -1.5s;
    }

    @keyframes st-orb-float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(10px, -14px); }
    }

    .st-splash-brand {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: #fff;
      user-select: none;
      pointer-events: none;
      animation: st-brand-in 650ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes st-brand-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .st-splash-mark-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .st-splash-icon {
      width: clamp(64px, 14vw, 88px);
      height: clamp(64px, 14vw, 88px);
      flex-shrink: 0;
    }

    .st-splash-title {
      font-weight: 800;
      font-size: clamp(28px, 6.5vw, 40px);
      letter-spacing: -0.5px;
      line-height: 1;
    }

    .st-splash-tagline {

  <script>
    (function () {
      var meta = document.querySelector('meta[name="st-api-base"]');
      var configured = meta && meta.getAttribute('content');
      if (configured) {
        window.stApiBaseUrl = configured;
      } else {
        var loc = window.location;
        var host = loc.hostname;
        if (host === 'localhost' || host === '127.0.0.1') {
          window.stApiBaseUrl = (loc.protocol || 'http:') + '//' + host + ':8000';
        } else {
          window.stApiBaseUrl = loc.origin;
        }
      }

      function isStandalone() {
        try {
          if (window.matchMedia('(display-mode: standalone)').matches) return true;
          if (window.matchMedia('(display-mode: fullscreen)').matches) return true;
          if (window.matchMedia('(display-mode: minimal-ui)').matches) return true;
          if (window.navigator.standalone === true) return true;
        } catch (e) {}
        return false;
      }

      function measureSafeArea() {
        var insets = { top: 0, right: 0, bottom: 0, left: 0 };
        try {
          var probe = document.createElement('div');
          probe.style.cssText =
            'position:fixed;top:0;left:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);visibility:hidden;pointer-events:none;';
          document.body.appendChild(probe);
          var cs = getComputedStyle(probe);
          insets.top = parseFloat(cs.paddingTop) || 0;
          insets.right = parseFloat(cs.paddingRight) || 0;
          insets.bottom = parseFloat(cs.paddingBottom) || 0;
          insets.left = parseFloat(cs.paddingLeft) || 0;
          document.body.removeChild(probe);
        } catch (e) {}
        window.stSafeInsets = insets;
      }

      function preloadMaterialFont() {
        var urls = ['fonts/MaterialIcons-Regular.otf', 'assets/fonts/MaterialIcons-Regular.otf'];
        urls.forEach(function (url) {
          try {
            var f = new FontFace('MaterialIcons', 'url(' + url + ')', { display: 'swap' });
            f.load().then(function (loaded) { document.fonts.add(loaded); }).catch(function () {});
          } catch (e) {}
        });
      }

      function setAppHeight() {
        // Toujours innerHeight (pas visualViewport) — sinon décalage hit-test PWA iOS.
        var h = window.innerHeight || document.documentElement.clientHeight;
        document.documentElement.style.setProperty('--st-app-height', Math.round(h) + 'px');
      }

      window.stPwaStandalone = isStandalone();

      if (window.stPwaStandalone) {
        document.documentElement.classList.add('pwa-standalone');
      }
      window.stSafeInsets = { top: 0, right: 0, bottom: 0, left: 0 };

      var buildMeta = document.querySelector('meta[name="st-build"]');
      var buildId = buildMeta ? (buildMeta.getAttribute('content') || '') : '';
      if (buildId) {
        console.info('[SombaTeka] build', buildId);
        try {
          var prev = localStorage.getItem('st-build');
          if (prev && prev !== buildId) {
            // Nouveau build → purge caches PWA pour éviter UI obsolète (profil blanc, etc.)
            if (window.caches && caches.keys) {
              caches.keys().then(function (keys) {
                keys.forEach(function (k) { caches.delete(k); });
              });
            }
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (r) { r.unregister(); });
              });
            }
          }
          localStorage.setItem('st-build', buildId);
        } catch (e) {}
      }

      document.addEventListener('DOMContentLoaded', function () {
        measureSafeArea();
        setAppHeight();
        preloadMaterialFont();
      });

      window.addEventListener('load', function () {
        measureSafeArea();
        setAppHeight();
        preloadMaterialFont();
        // Cache assets Flutter (JS/WASM/fonts) — pas l'API.
        if ('serviceWorker' in navigator) {
          var swUrl = '/flutter_service_worker.js' + (buildId ? ('?v=' + encodeURIComponent(buildId)) : '');
          navigator.serviceWorker.register(swUrl).catch(function (e) {
            console.warn('[SombaTeka] SW register skipped:', e);
          });
        }
      });

      window.addEventListener('resize', function () {
        measureSafeArea();
        setAppHeight();
      });
      window.addEventListener('orientationchange', function () {
        setTimeout(function () { measureSafeArea(); setAppHeight(); }, 150);
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', function () {
          measureSafeArea();
          setAppHeight();
        });
      }

      function hideStSplash() {
        var splash = document.getElementById('st-splash');
        if (!splash) return;
        if (splash.dataset.done === '1') {
          splash.style.pointerEvents = 'none';
          splash.style.display = 'none';
          return;
        }
        splash.dataset.done = '1';
        // Libère les touches tout de suite, fade court, puis retire le nœud.
        // Évite l'écran bleu vide si Flutter n'a pas encore peint l'UI.
        splash.style.pointerEvents = 'none';
        splash.classList.add('st-splash-hide');
        splash.style.transition = 'opacity 180ms ease-out';
        splash.style.opacity = '0';
        setTimeout(function () {
          try {
            splash.style.display = 'none';
            if (splash.parentNode) splash.parentNode.removeChild(splash);
          } catch (e) {}
        }, 200);
      }

      window.hideStSplash = hideStSplash;

      // Ne PAS masquer au premier frame Flutter — l'UI peut encore être vide (bleu).
      // Dart appelle hideStSplash quand Intro/Main/Detail est vraiment prêt.
      window.addEventListener('flutter-first-frame', function () {
        // no-op: splash reste jusqu'à stHideHtmlSplash() côté Flutter
      });

      // Secours long uniquement — jamais bloquer l'utilisateur.
      setTimeout(hideStSplash, 7000);
    })();
  </script>
