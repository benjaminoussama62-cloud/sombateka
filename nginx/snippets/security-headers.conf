# Inclure dans CHAQUE location qui utilise add_header
# (sinon nginx écrase les headers serveur — HSTS / X-Frame / nosniff).
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-XSS-Protection "1; mode=block" always;
# Requis pour Google Sign-In (popup) — évite les warnings COOP / window.closed
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Cross-Origin-Embedder-Policy "unsafe-none" always;

# Content-Security-Policy — bloque scripts/CDN tiers inconnus, <object>,
# clickjacking, base-uri hijack, formulaires et http→https.
# 'unsafe-inline'+'unsafe-eval' restent requis par Flutter web (bootstrap
# inline + CanvasKit wasm) — la CSP bloque quand même les sources externes.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://apis.google.com https://appleid.cdn-apple.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' wss: https://*.googleapis.com https://accounts.google.com https://appleid.cdn-apple.com https://*.ingest.sentry.io; frame-src https://accounts.google.com https://appleid.cdn-apple.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
