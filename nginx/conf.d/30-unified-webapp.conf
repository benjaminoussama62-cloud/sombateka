# SombaTeka — domaine unique : app Flutter Web + API + pages légales
# Montage Docker : ../web-dist:/var/www/sombateka:ro

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sombatekaonline.com www.sombatekaonline.com;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 12M;

    root /var/www/sombateka;
    index index.html;

    # Bloquer chemins cachés / secrets (évite SPA 200 sur /.env, /.git, …)
    # ^~ /.well-known/ ci-dessous a priorité sur cette regex.
    location ~ /\. {
        return 404;
    }

    location = /.env { return 404; }
    location = /.env.production { return 404; }
    location = /.env.local { return 404; }
    location ^~ /.git { return 404; }
    location ^~ /.svn { return 404; }
    location ^~ /.hg { return 404; }

    # ── API & backend ─────────────────────────────────────────────
    location /healthz {
        proxy_pass http://backend/healthz;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /health {
        proxy_pass http://backend/health;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /api/upload {
        limit_req zone=upload burst=5 nodelay;
        proxy_pass http://backend;
        include /etc/nginx/snippets/proxy-backend.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /api/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://backend;
        include /etc/nginx/snippets/proxy-backend.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /ws/ {
        limit_req zone=ws burst=10 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ne pas logger le query string (ancien ?token=) si présent
        access_log off;
        proxy_read_timeout 86400;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /docs {
        return 404;
    }

    location /openapi.json {
        return 404;
    }

    location /redoc {
        return 404;
    }

    # SEO pro — produits, catégories, catalogue, sitemaps, feed Merchant Center
    location ^~ /annonce/ {
        proxy_pass http://backend;
        include /etc/nginx/snippets/proxy-backend.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ^~ /categorie/ {
        proxy_pass http://backend;
        include /etc/nginx/snippets/proxy-backend.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ^~ /ville/ {
        proxy_pass http://backend;
        include /etc/nginx/snippets/proxy-backend.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /catalogue {
        proxy_pass http://backend;
        include /etc/nginx/snippets/proxy-backend.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ^~ /feeds/ {
        proxy_pass http://backend;
        include /etc/nginx/snippets/proxy-backend.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /sitemap-products.xml {
        proxy_pass http://backend;
        include /etc/nginx/snippets/proxy-backend.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /sitemap-categories.xml {
        proxy_pass http://backend;
        include /etc/nginx/snippets/proxy-backend.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /sitemap-cities.xml {
        proxy_pass http://backend;
        include /etc/nginx/snippets/proxy-backend.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Index sitemap servi en statique (HEAD/GET OK pour Google Search Console)
    location = /sitemap-index.xml {
        try_files /sitemap-index.xml =404;
        default_type application/xml;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Panneau staff : Basic Auth nginx AVANT la page de login
    # (le public reçoit 401 — jamais le formulaire). Identifiants
    # htpasswd stockés sur le VPS uniquement (hors repo).
    location ^~ /admin/ {
        auth_basic "SombaTeka Staff";
        auth_basic_user_file /etc/nginx/conf.d/.htpasswd-admin;
        limit_req zone=admin burst=20 nodelay;
        proxy_pass http://backend;
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/proxy-backend.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /admin {
        return 404;
    }

    location ^~ /uploads/ {
        proxy_pass http://backend/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ── Pages légales (Play Store / App Store) ────────────────────
    location = /about {
        try_files /about.html =404;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /marketplace-rdc {
        try_files /marketplace-rdc.html =404;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /kinshasa {
        try_files /kinshasa.html =404;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /terms {
        try_files /terms.html =404;
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /privacy {
        try_files /privacy.html =404;
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /account-deletion {
        try_files /account-deletion.html =404;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /robots.txt {
        try_files /robots.txt =404;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /sitemap.xml {
        try_files /sitemap.xml =404;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ^~ /.well-known/ {
        try_files $uri =404;
        access_log off;
    }

    location ^~ /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*";
        include /etc/nginx/snippets/security-headers.conf;
        types { font/otf otf; application/font-sfnt otf; }
        default_type font/otf;
    }

    location ^~ /assets/fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*";
        include /etc/nginx/snippets/security-headers.conf;
        types { font/otf otf; application/font-sfnt otf; }
        default_type font/otf;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ^~ /icons/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ^~ /canvaskit/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Shell app — JAMAIS en cache immutable (sinon iPhone/Chrome gardent l'ancienne version)
    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~ ^/main\.dart\.js {
        try_files /main.dart.js =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~ ^/flutter_bootstrap\.js {
        try_files /flutter_bootstrap.js =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~ ^/flutter\.js {
        try_files /flutter.js =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /flutter_service_worker.js {
        try_files /flutter_service_worker.js =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /manifest.json {
        try_files /manifest.json =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /version.json {
        try_files /version.json =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~* \.(wasm|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|otf)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ── App Flutter Web (SPA) ─────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name sombatekaonline.com www.sombatekaonline.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Healthcheck Docker uniquement — pas d'exposition publique inutile
    location /healthz {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://backend/healthz;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
