name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pip-audit
      - name: Dependency vulnerability scan
        continue-on-error: true
        run: pip-audit -r requirements.txt
      - run: pytest -q

  nginx-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate nginx config syntax
        run: |
          mkdir -p /tmp/nginx-ssl
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout /tmp/nginx-ssl/key.pem \
            -out /tmp/nginx-ssl/cert.pem \
            -days 1 -subj "/CN=sombatekaonline.com" 2>/dev/null
          docker run --rm \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/nginx/conf.d:/etc/nginx/conf.d:ro" \
            -v "$PWD/nginx/snippets:/etc/nginx/snippets:ro" \
            -v /tmp/nginx-ssl:/etc/nginx/ssl:ro \
            nginx:alpine nginx -t
      - name: Security headers snippet present
        run: |
          grep -q 'Strict-Transport-Security' nginx/snippets/security-headers.conf
          grep -q 'security-headers.conf' nginx/conf.d/30-unified-webapp.conf
          grep -q 'location ~ /\\.' nginx/conf.d/30-unified-webapp.conf
          grep -q 'X-Forwarded-For \$remote_addr' nginx/snippets/proxy-backend.conf

  mobile-analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
